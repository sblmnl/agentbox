name: ci

on:
  push:
    branches: [main]
  pull_request:
  # toolchain-build below depends on third-party infrastructure that moves on
  # its own schedule, not on ours, so it also runs nightly rather than only
  # when someone happens to touch the repo.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: build
        run: go build -trimpath ./cmd/agentbox
      - name: test
        # The ignore-matcher suite differentially tests against
        # `git check-ignore` (present on the runner).
        run: go test ./...

  # The Layer-0 mask-view test exercises real mounts and needs
  # CAP_SYS_ADMIN. It skips visibly without privilege, so it gets its own
  # job that fails if the test skipped rather than ran.
  mask-privileged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: layer-0 real mounts (root)
        run: |
          sudo env "PATH=$PATH" go test -run TestLayer0RealMounts ./internal/mask/ -v | tee out.txt
          if grep -q 'SKIP' out.txt; then
            echo "privileged mask test skipped instead of running" >&2
            exit 1
          fi
      - name: layer-3 filtered share, real FUSE mount (root)
        run: |
          sudo env "PATH=$PATH" go test -run TestFilterRealMount ./internal/share/ -v | tee out3.txt
          if grep -q 'SKIP' out3.txt; then
            echo "privileged filter test skipped instead of running" >&2
            exit 1
          fi

  # The VM conformance suite on a KVM-capable runner
  # (GitHub-hosted Linux runners expose /dev/kvm). A CI configuration that
  # skips this suite MUST NOT report success, so the job fails when the
  # suite skips rather than runs — a green build that silently omitted the
  # conformance suite is the failure mode this job exists to prevent.
  vm-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: enable /dev/kvm for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: install kata containers (static release)
        env:
          KATA_VERSION: "3.10.1"
        run: |
          curl -fsSL -o kata.tar.xz \
            "https://github.com/kata-containers/kata-containers/releases/download/${KATA_VERSION}/kata-static-${KATA_VERSION}-amd64.tar.xz"
          sudo tar -xf kata.tar.xz -C /
          sudo ln -sf /opt/kata/bin/containerd-shim-kata-v2 /usr/local/bin/containerd-shim-kata-v2
          sudo ln -sf /opt/kata/bin/kata-runtime /usr/local/bin/kata-runtime
          kata-runtime --version
      - name: register the kata runtime with docker
        run: |
          sudo mkdir -p /etc/docker
          echo '{ "runtimes": { "kata": { "runtimeType": "io.containerd.kata.v2" } } }' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q kata
      - name: run the vm conformance suite (root — host-side mask view)
        run: |
          go build -o agentbox ./cmd/agentbox
          sudo env "PATH=$PATH" \
            AGENTBOX_VM_CONFORMANCE=1 AGENTBOX_BIN="$GITHUB_WORKSPACE/agentbox" \
            go test -v -count=1 -timeout 30m ./test/vmconformance/ | tee vm-out.txt
          if grep -Eq -- '--- SKIP' vm-out.txt; then
            echo "vm conformance suite skipped instead of running" >&2
            exit 1
          fi

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./cmd/agentbox
      - name: smoke
        run: |
          set -x
          ./agentbox help
          ./agentbox version --json
          mkdir -p /tmp/smoke && cd /tmp/smoke && git init -q .
          $GITHUB_WORKSPACE/agentbox init
          $GITHUB_WORKSPACE/agentbox config --origin > /dev/null
          $GITHUB_WORKSPACE/agentbox status
          # --dry-run is the inspection surface: it must produce the whole
          # plan, including the mask set, without a backend on the host.
          $GITHUB_WORKSPACE/agentbox --dry-run --json | grep -q '"mask_mode"'
          # A key removed in the MVP schema must be a hard error (78), never
          # silently ignored.
          printf 'version = 1\n[hooks]\npre_up = ["true"]\n' > agentbox.toml
          rc=0; $GITHUB_WORKSPACE/agentbox config || rc=$?
          test "$rc" = "78"
          # A workspace config that weakens a security key must say so on
          # every invocation.
          printf 'version = 1\n[network]\nmode = "open"\n' > agentbox.toml
          $GITHUB_WORKSPACE/agentbox config 2>&1 >/dev/null | grep -q "network.mode"

  # Every other test in this file asserts over the *text* of the generated
  # Dockerfile, which can never catch upstream drift: a recipe that names a
  # package no feed carries, or a repo layout that moved, passes those tests
  # and fails every real build. The toolchain recipes are also the one part of
  # agentbox that depends on infrastructure nobody here controls — third-party
  # apt repos, signing keys, release tarballs, distro package names.
  #
  # So this job builds each toolchain for real and runs the installed compiler,
  # asserting it is the *requested* version. Verification asserts rather than
  # prints on purpose: a toolchain that installs to a path the `agent` user
  # cannot reach is a silent fallback to whatever the distro ships, which is
  # exactly the failure a `--version` smoke test scrolls straight past.
  toolchain-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: node
            version: "24"
            verify: node --version | grep -q '^v24\.' && npm --version >/dev/null
          - toolchain: dotnet
            version: "10"
            verify: dotnet --list-sdks | grep -q '^10\.'
          - toolchain: python
            version: "3.13"
            # The uv-managed interpreter must be the one on PATH for the
            # unprivileged user — not merely present somewhere. Asserting the
            # path too, so a distro python arriving as some package's
            # dependency and winning the lookup fails the job.
            verify: test "$(command -v python3)" = /usr/local/bin/python3 && python3 --version | grep -q '^Python 3\.13\.' && python --version | grep -q '^Python 3\.13\.'
          - toolchain: go
            version: "1.26.5"
            verify: go version | grep -q 'go1\.26\.5'
          - toolchain: rust
            version: stable
            verify: rustc --version >/dev/null && cargo --version >/dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build agentbox
        run: go build -trimpath -o "$RUNNER_TEMP/agentbox" ./cmd/agentbox
      - name: build the ${{ matrix.toolchain }} image
        run: |
          set -eux
          proj="$RUNNER_TEMP/tc"
          mkdir -p "$proj" && git -C "$proj" init -q
          printf 'version = 1\n[toolchains]\n%s = "%s"\n' \
            '${{ matrix.toolchain }}' '${{ matrix.version }}' > "$proj/agentbox.toml"
          cd "$proj" && "$RUNNER_TEMP/agentbox" build
      - name: run the installed ${{ matrix.toolchain }} toolchain
        # Through the environment, not ${{ }} interpolation: the snippets
        # contain their own quoting, which would not survive being pasted
        # inside a shell string.
        env:
          VERIFY: ${{ matrix.verify }}
        run: |
          set -eux
          # One toolchain per runner, so the build leaves exactly one image.
          tag=$(docker images --filter=reference='agentbox/dev:*' --format '{{.Repository}}:{{.Tag}}')
          test "$(printf '%s\n' "$tag" | grep -c .)" = 1
          # No --user: the image's own USER (agent) is what the box runs as.
          docker run --rm -e VERIFY "$tag" bash -lc 'eval "$VERIFY"'

  man-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mandoc
        run: sudo apt-get update -q && sudo apt-get install -y mandoc groff
      - name: lint man pages
        run: make man-lint
